name: Render Market Hours Keep-Alive

on:
  schedule:
    # Runs every 10 minutes from 03:20 UTC to 10:10 UTC, Monday through Friday
    # IST is UTC+05:30 -> 03:25 UTC is 08:55 IST, 10:05 UTC is 15:35 IST
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check (IST Market Hours Only)
        run: |
          python3 - << 'EOF'
          import json
          import sys
          import time
          import urllib.request
          from datetime import datetime, time as dtime, timedelta, timezone

          IST = timezone(timedelta(hours=5, minutes=30), name="IST")
          now_ist = datetime.now(IST)
          time_str = now_ist.strftime("%Y-%m-%d %H:%M:%S IST")
          weekday = now_ist.weekday() # 0 = Monday, 6 = Sunday

          market_start = dtime(8, 55)
          market_end = dtime(15, 35)

          # Allow manual triggers via workflow_dispatch even outside market hours if GITHUB_EVENT_NAME == 'workflow_dispatch'
          is_manual = "${{ github.event_name }}" == "workflow_dispatch"

          if weekday in (5, 6) and not is_manual:
              print(f"[{time_str}] Weekend ({now_ist.strftime('%A')}) -> Sleep preserved for Render free tier.")
              sys.exit(0)

          if not (market_start <= now_ist.time() <= market_end) and not is_manual:
              print(f"[{time_str}] Outside market hours ({now_ist.time().strftime('%H:%M:%S')} IST) -> Sleep preserved.")
              sys.exit(0)

          url = "https://orderblock-backend-latest.onrender.com/api/health"
          print(f"[{time_str}] Market hours active -> Pinging {url}...")

          start = time.time()
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "GitHub-Actions-KeepAlive/1.0 (+https://github.com/Kkaif4/order-block-FE)"},
              method="GET"
          )
          try:
              with urllib.request.urlopen(req, timeout=75) as resp:
                  latency = int((time.time() - start) * 1000)
                  print(f"[{time_str}] Success! HTTP {resp.status} in {latency}ms | Render ID: {resp.headers.get('rndr-id', 'unknown')}")
          except Exception as e:
              latency = int((time.time() - start) * 1000)
              print(f"[{time_str}] Health check response in {latency}ms: {e}")
          EOF
